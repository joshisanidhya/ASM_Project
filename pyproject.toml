[project]
name = "headway"
version = "0.1.0"
description = "Headway distribution b^|t-a| (Leungbootnak et al.) fitted via MCMC and compared with six baselines"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "matplotlib"]

[project.optional-dependencies]
lyft = ["zarr<3"]  # Lyft Level 5 files are zarr v2

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
